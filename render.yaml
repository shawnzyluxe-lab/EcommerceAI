services:
  - type: web
    name: shawnzyluxe
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - --log-level info app:app
    healthCheckPath: /health
    domains:
      - vantavcommerce.com
      - www.vantavcommerce.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SHOPIFY_DOMAIN
        sync: false
      - key: SHOPIFY_STOREFRONT_TOKEN
        sync: false
      - key: SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID
        sync: false
      - key: SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_ADMIN_EMAIL
        value: shawn@vantavcommerce.com
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: ENGINEER_EMAIL
        value: engineer@vantavcommerce.com
      - key: TEMP_ACCOUNTS_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MERCHANT_EMAIL
        sync: false
      - key: MERCHANT_PHONE
        sync: false
      - key: SUPPLIER_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_OPERATOR_MONTHLY
        sync: false
      - key: STRIPE_PRICE_GROWTH_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SCALE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_CONCIERGE_BUNDLE
        sync: false
      - key: STRIPE_PRICE_CONCIERGE_BUNDLE_MONTHLY
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        value: https://vantavcommerce.com/api/v1/auth/shopify/callback
      # Alert channels (comma-separated for ALERT_EMAIL)
      - key: ALERT_EMAIL
        sync: false
      - key: ALERT_PHONE
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SLA_WEBHOOK_URL
        sync: false
      # SLA thresholds (defaults are set in monitoring.py)
      - key: SLA_SLOW_P95_MS
        sync: false
      - key: SLA_ERROR_RATE_THRESHOLD
        sync: false
      - key: SLA_MAX_PENDING_ACTIONS
        sync: false
      - key: SLA_MAX_CHANNEL_SYNC_AGE_SECONDS
        sync: false
      - key: SLA_DB_LATENCY_MS
        sync: false
