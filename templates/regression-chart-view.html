<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantav — Historical Margin Stability Forecast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        onyx: '#0D0D11',
                        slateDark: '#16161F',
                        borderMuted: '#262636',
                        accentGold: '#D4AF37'
                    },
                    fontFamily: {
                        mono: ['Courier New', 'Courier', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-onyx p-6 min-h-screen text-gray-100 font-sans selection:bg-accentGold selection:text-onyx">

    <div class="w-full max-w-4xl mx-auto border border-borderMuted bg-slateDark/40 rounded-sm p-6 shadow-2xl space-y-6">

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-borderMuted/60 pb-4 space-y-2 md:space-y-0">
            <div>
                <span class="text-[10px] font-mono uppercase tracking-[0.2em] text-accentGold block">// CORE ANALYTICAL REGRESSION GRAPH</span>
                <h2 class="text-lg font-bold text-white uppercase tracking-wide font-mono mt-0.5">Historical Margin Stability Forecast</h2>
            </div>
            <div class="flex space-x-4 text-xs font-mono">
                <div class="bg-onyx/60 border border-borderMuted px-3 py-1.5 rounded-sm">
                    <span class="text-gray-500">TREND:</span> <span class="text-red-400 font-bold" id="ui-trend-direction">EVALUATING...</span>
                </div>
                <div class="bg-onyx/60 border border-borderMuted px-3 py-1.5 rounded-sm">
                    <span class="text-gray-500">R&sup2; RATING:</span> <span class="text-accentGold font-bold" id="ui-r2-score">--.--%</span>
                </div>
            </div>
        </div>

        <div class="w-full bg-onyx/80 border border-borderMuted rounded-sm p-4 h-[340px] relative">
            <canvas id="vantaRegressionChart"></canvas>
        </div>

        <div class="p-4 bg-slateDark border border-borderMuted rounded-sm text-xs font-mono flex items-start space-x-3">
            <span class="text-accentGold text-sm">+</span>
            <div>
                <p class="text-gray-300 font-semibold uppercase tracking-wider mb-1">Assistant Diagnostics Ledger Output:</p>
                <p class="text-gray-400 leading-relaxed" id="ui-reasoning-summary">Initializing core regression parameters matrix. Querying historical cost waterfall data...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sku = urlParams.get("sku") || "SKU-404-PODS";

            let data;
            try {
                const response = await fetch(`/api/v1/analytics/profit-regression?sku=${encodeURIComponent(sku)}`);
                if (!response.ok) {
                    throw new Error(`Regression API returned ${response.status}`);
                }
                data = await response.json();
            } catch (err) {
                document.getElementById("ui-reasoning-summary").innerText = "Unable to load regression data: " + err.message;
                document.getElementById("ui-trend-direction").innerText = "ERROR";
                return;
            }

            document.getElementById("ui-trend-direction").innerText = data.trend_direction;
            document.getElementById("ui-r2-score").innerText = (data.r_squared_confidence * 100).toFixed(2) + "%";

            const reason = `Mathematical OLS regression on ${data.sku} shows a slope of $${data.slope_rate_of_change}/day ` +
                           `with ${(data.r_squared_confidence * 100).toFixed(2)}% confidence. ` +
                           `7-day projected net profit: $${data.projected_net_profit_7d}.`;
            document.getElementById("ui-reasoning-summary").innerText = reason;

            const labels = data.historical_points.map(p => p.label).concat(
                data.trend_line.filter(t => t.days_ago < 0).map(t => t.label)
            );

            const historicalDots = data.historical_points.map(p => p.net_profit);
            // Pad with nulls for future labels so the historical points stay aligned.
            const trendPoints = data.trend_line.map(t => t.predicted_net_profit < 0 ? 0 : t.predicted_net_profit);

            const ctx = document.getElementById('vantaRegressionChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'True Net Profit ($)',
                            data: data.historical_points.map(p => p.net_profit).concat(
                                data.trend_line.filter(t => t.days_ago < 0).map(() => null)
                            ),
                            borderColor: '#FFFFFF',
                            backgroundColor: '#FFFFFF',
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            showLine: false,
                            z: 2
                        },
                        {
                            label: 'OLS Regression Trend Slope',
                            data: trendPoints,
                            borderColor: '#D4AF37',
                            borderWidth: 1.5,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false,
                            tension: 0,
                            z: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#9CA3AF',
                                font: { family: 'Courier New', size: 11 }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#262636' },
                            ticks: { color: '#9CA3AF', font: { family: 'Courier New' } }
                        },
                        y: {
                            grid: { color: '#262636' },
                            ticks: { color: '#9CA3AF', font: { family: 'Courier New' } },
                            min: 0
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
