<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password — Vantav</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        onyx: '#0D0D11',
                        slateDark: '#16161F',
                        borderMuted: '#262636',
                        accentGold: '#D4AF37'
                    },
                    fontFamily: {
                        mono: ['Courier New', 'Courier', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        .glow-ring { box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
    </style>
</head>
<body class="bg-onyx text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md p-6 bg-slateDark border border-borderMuted rounded-md shadow-2xl text-left">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-3 h-3 bg-accentGold rounded-full glow-ring"></div>
            <span class="font-mono text-sm tracking-[0.3em] font-bold text-white">VANTAV</span>
        </div>
        <h1 class="text-sm font-mono uppercase tracking-widest text-gray-400 mb-4">Reset password</h1>
        <form id="resetForm" onsubmit="submitReset(event)">
            <input type="hidden" id="token" value="{{ token }}">
            <input type="password" id="new-password" class="w-full bg-onyx border border-borderMuted focus:border-accentGold rounded-sm px-3 py-2 text-sm text-white font-mono placeholder:text-gray-600 focus:outline-none transition mb-2" placeholder="New password" minlength="8" required>
            <input type="password" id="confirm-password" class="w-full bg-onyx border border-borderMuted focus:border-accentGold rounded-sm px-3 py-2 text-sm text-white font-mono placeholder:text-gray-600 focus:outline-none transition mb-2" placeholder="Confirm new password" minlength="8" required>
            <label class="flex items-center text-xs font-mono text-gray-400 mb-4 cursor-pointer">
                <input type="checkbox" class="accent-accentGold mr-2" onchange="toggleShow()">
                Show password
            </label>
            <button type="submit" class="w-full bg-white hover:bg-accentGold text-onyx font-bold uppercase text-xs tracking-widest py-3 px-4 transition font-mono rounded-sm shadow-md">
                Update password
            </button>
        </form>
        <div id="message" class="hidden text-xs font-mono mt-3"></div>
        <a href="/" class="block mt-4 text-xs font-mono text-accentGold hover:text-white underline">Back to login</a>
    </div>

    <script>
        function toggleShow() {
            const type = document.getElementById('new-password').type === 'password' ? 'text' : 'password';
            document.getElementById('new-password').type = type;
            document.getElementById('confirm-password').type = type;
        }

        async function submitReset(event) {
            event.preventDefault();
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const msg = document.getElementById('message');

            if (newPassword !== confirmPassword) {
                msg.textContent = "Passwords do not match.";
                msg.className = "text-xs font-mono mt-3 text-red-500";
                msg.classList.remove('hidden');
                return;
            }

            const response = await fetch('/api/v1/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, new_password: newPassword })
            });
            const result = await response.json();

            msg.textContent = result.detail || "Unknown error.";
            msg.className = response.ok ? "text-xs font-mono mt-3 text-green-500" : "text-xs font-mono mt-3 text-red-500";
            msg.classList.remove('hidden');

            if (response.ok) {
                document.getElementById('resetForm').classList.add('hidden');
                setTimeout(() => window.location.href = result.redirect || '/', 1500);
            }
        }
    </script>
</body>
</html>
