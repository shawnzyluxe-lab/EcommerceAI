<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prometheus OS by Shawnzyluxe</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #050505;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .container { padding: 2rem; max-width: 720px; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 0.25em;
      background: linear-gradient(90deg, #fff, #a8a8a8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .byline {
      font-size: clamp(1rem, 3vw, 1.35rem);
      color: #888;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .coming-soon {
      font-size: clamp(1.2rem, 4vw, 1.75rem);
      color: #ccc;
      border: 1px solid #333;
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      margin-top: 1.5rem;
    }
    .footer {
      position: fixed;
      bottom: 1rem;
      width: 100%;
      text-align: center;
      font-size: .75rem;
      color: #666;
    }
    .footer a { color: #888; text-decoration: none; }
    .footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <p class="byline">Shawnzyluxe presents</p>
    <h1>Prometheus OS</h1>
    <div class="coming-soon">Coming Soon</div>
  </div>
  <div class="footer">
    &copy; 2026 Vantav LLC &middot; <a href="/terms">Terms</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/refund">Refund</a>
  </div>
</body>
</html>
