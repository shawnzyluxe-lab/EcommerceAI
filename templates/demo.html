<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vantav — See how it works</title>
  <meta name="description" content="Watch a quick walkthrough of Vantav: real-time profit, multi-channel sync, and AI-drafted actions you approve.">
  <style>
    :root {
      --bg: #0c0c11;
      --card: #14141c;
      --ink: #f4f2f9;
      --muted: #c6c3d2;
      --line: #23232d;
      --purple: #8b5cf6;
      --purple-2: #a78bfa;
      --teal: #2dd4bf;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 1.5rem; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: .6rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 7px;
      background: #14141c;
      display: grid; place-items: center;
      box-shadow: 0 4px 10px rgba(139,92,246,.25);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand span { font-size: 1.1rem; }
    .nav a { font-size: .85rem; color: var(--muted); font-weight: 500; padding: .5rem .9rem; border-radius: 8px; }
    .nav a:hover { color: var(--ink); background: #1b1b25; }
    .nav .btn {
      background: linear-gradient(135deg, var(--purple) 0%, #0c0c11 100%);
      color: var(--ink); font-weight: 700; padding: .55rem 1.1rem; border-radius: 8px;
      box-shadow: 0 4px 12px rgba(139,92,246,.25);
    }
    .hero {
      text-align: center; padding: 4rem 1.5rem 1.75rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800; letter-spacing: -0.03em; line-height: 1.08;
      margin: 0 auto 1rem; max-width: 100%;
      overflow-wrap: break-word;
      background: linear-gradient(135deg, #f4f2f9 30%, var(--purple-2) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 1.05rem; color: var(--muted); line-height: 1.65;
      max-width: 560px; margin: 0 auto 1.5rem;
    }
    .demo { text-align: center; padding: 0 1.5rem 4rem; }
    .video-wrap {
      max-width: 720px; margin: 0 auto; border-radius: 16px; overflow: hidden;
      border: 1px solid var(--line); background: var(--card);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .video-wrap video { width: 100%; display: block; }
    .ctas { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
    .btn-primary {
      background: linear-gradient(135deg, var(--purple) 0%, #0c0c11 100%);
      color: var(--ink); font-weight: 700; padding: .9rem 1.6rem; border-radius: 10px;
      box-shadow: 0 6px 18px rgba(139,92,246,.28);
      border: none; font-size: 1rem;
    }
    .btn-secondary {
      border: 1px solid var(--line); color: var(--ink); background: transparent;
      padding: .9rem 1.6rem; border-radius: 10px; font-weight: 600; font-size: 1rem;
    }
    footer { border-top: 1px solid var(--line); padding: 1.5rem; text-align: center; color: var(--muted); font-size: .8rem; }
    @media (max-width: 600px) {
      .nav { display: none; }
      h1 { font-size: 1.85rem; }
    }
    @media (max-width: 480px) {
      .wrap { padding: 0 1rem; }
      .hero { padding: 3rem 1rem 1.25rem; }
      .demo { padding: 0 1rem 2.5rem; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Vantav logo">
          <defs>
            <linearGradient id="vantav-v" x1="8" y1="8" x2="24" y2="26" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#8b5cf6"/>
              <stop offset="1" stop-color="#14b8a6"/>
            </linearGradient>
          </defs>
          <path d="M9 11 L16 25 L23 11" stroke="url(#vantav-v)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span>VANTAV</span>
    </a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/subscribe" class="btn">Get Started</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>See how Vantav works</h1>
      <p>Real-time profit by channel, automated alerts, and Vantav drafts actions you approve.</p>
    </section>

    <section class="wrap demo">
      <div class="video-wrap">
        <video controls preload="metadata" playsinline autoplay muted>
          <source src="{{ url_for('static', filename='videos/demo.mp4') }}" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div class="ctas">
        <a href="/subscribe" class="btn-primary">View Plans</a>
        <a href="/" class="btn-secondary">Back to home</a>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2026 Vantav LLC. <a href="/terms" style="color:var(--muted)">Terms</a> &middot; <a href="/privacy" style="color:var(--muted)">Privacy</a>
  </footer>
</body>
</html>
