<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Vantav</title>
  <style>
    :root { --bg: #0c0c11; --card: #14141c; --ink: #f4f2f9; --muted: #c6c3d2; --line: #23232d; --accent: #8b5cf6; --accent-2: #a78bfa; --accent-bg: rgba(139,92,246,0.12); --success: #34d399; --error: #fb7185; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 3rem 1.5rem; }
    .topbar { text-align: center; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
    h1 { text-align: center; font-size: 2rem; margin: 0 0 .5rem; }
    .sub { text-align: center; color: var(--muted); margin-bottom: 2rem; }
    .plan { border: 1px solid var(--line); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; cursor: pointer; transition: .2s; display: flex; align-items: center; gap: 1rem; }
    .plan:hover { border-color: var(--accent); }
    .plan.selected { border-color: var(--accent); background: var(--accent-bg); }
    .plan input { width: 20px; height: 20px; accent-color: var(--accent); }
    .plan .title { font-weight: 700; margin-bottom: .25rem; }
    .plan .price { color: var(--accent); font-weight: 700; }
    .plan .desc { font-size: .85rem; color: var(--muted); }
    .bundle { border: 1px dashed var(--line); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; cursor: pointer; transition: .2s; display: flex; align-items: flex-start; gap: 1rem; }
    .bundle:hover { border-color: var(--accent); }
    .bundle.selected { border-style: solid; border-color: var(--accent); background: var(--accent-bg); }
    .bundle input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: .2rem; }
    label { display: block; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: .4rem; }
    input { width: 100%; padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 10px; background: #14141c; color: var(--ink); font-size: .9rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 520px) { .grid-2 { grid-template-columns: 1fr; } }
    button { width: 100%; padding: 1rem; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent) 0%, #0c0c11 100%); color: var(--ink); font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: .5rem; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .message { text-align: center; margin-top: 1rem; font-size: .85rem; }
    .success { color: var(--success); }
    .error { color: #fb7185; }
    footer { text-align: center; font-size: .75rem; color: var(--muted); padding: 2rem 0 1rem; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">Vantav</div>
    <h1>Complete your subscription</h1>
    <p class="sub">Choose your plan and create your account. You'll be redirected to Stripe to enter payment details.</p>

    <form id="checkout-form" onsubmit="submitCheckout(event)">
      <label class="plan" id="plan-operator-label">
        <input type="radio" name="plan" value="operator" onchange="selectPlan(this)">
        <div>
          <div class="title">Vantav Operator</div>
          <div class="price">$199/mo</div>
          <div class="desc">Full core loop: monitor, detect, recommend, approve. Up to 2 stores.</div>
        </div>
      </label>
      <label class="plan selected" id="plan-growth-label">
        <input type="radio" name="plan" value="growth" checked onchange="selectPlan(this)">
        <div>
          <div class="title">Vantav Growth <span style="font-size:.7rem; color:var(--accent-2); font-weight:600;">MOST POPULAR</span></div>
          <div class="price">$399/mo</div>
          <div class="desc">Up to 5 stores, advanced forecasting, cross-store views, action verification.</div>
        </div>
      </label>
      <label class="plan" id="plan-scale-label">
        <input type="radio" name="plan" value="scale" onchange="selectPlan(this)">
        <div>
          <div class="title">Vantav Scale</div>
          <div class="price">$799/mo</div>
          <div class="desc">Up to 15 stores, portfolio intelligence, API access, custom alerts.</div>
        </div>
      </label>

      <label class="bundle" id="bundle-concierge" onclick="toggleBundle()">
        <input type="checkbox" id="concierge_bundle" value="concierge_bundle">
        <div>
          <div class="title">Add Concierge Bundle — $999/mo</div>
          <div class="desc">Custom brand build, curated ad plan, SEO, and email setup. Combined services, one price.</div>
        </div>
      </label>

      <div class="grid-2">
        <div>
          <label>Email</label>
          <input type="email" id="email" placeholder="you@yourbrand.com" required>
        </div>
        <div>
          <label>Business name</label>
          <input type="text" id="business_name" placeholder="Your brand">
        </div>
      </div>
      <label>Create password</label>
      <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>

      <button type="submit" id="checkout-btn">Continue to secure payment</button>
      <div id="message" class="message"></div>
    </form>

    <footer>
      &copy; 2026 Vantav LLC. <a href="/terms">Terms</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/refund">Refund</a>
    </footer>
  </div>

  <script>
    function selectPlan(radio) {
      document.querySelectorAll('.plan').forEach(p => p.classList.remove('selected'));
      radio.closest('.plan').classList.add('selected');
    }
    (function initPlan() {
      const params = new URLSearchParams(window.location.search);
      const plan = params.get('plan') || 'growth';
      const radios = document.querySelectorAll('input[name="plan"]');
      radios.forEach(r => {
        if (r.value === plan) {
          r.checked = true;
          selectPlan(r);
        }
      });
      if (params.get('concierge_bundle') === '1') {
        const cb = document.getElementById('concierge_bundle');
        cb.checked = true;
        document.getElementById('bundle-concierge').classList.add('selected');
      }
    })();
    function toggleBundle() {
      const cb = document.getElementById('concierge_bundle');
      cb.checked = !cb.checked;
      document.getElementById('bundle-concierge').classList.toggle('selected', cb.checked);
    }
    async function submitCheckout(e) {
      e.preventDefault();
      const msg = document.getElementById('message');
      const btn = document.getElementById('checkout-btn');
      msg.className = 'message';
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Redirecting...';
      try {
        const plan = document.querySelector('input[name="plan"]:checked').value;
        const concierge_bundle = document.getElementById('concierge_bundle').checked;
        const res = await fetch('/api/v1/stripe/create-checkout', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('email').value,
            business_name: document.getElementById('business_name').value,
            password: document.getElementById('password').value,
            plan: plan,
            concierge_bundle: concierge_bundle,
          }),
        });
        const data = await res.json();
        if (res.ok && data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.detail || 'Checkout failed');
        }
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'message error';
        btn.disabled = false;
        btn.textContent = 'Continue to secure payment';
      }
    }
  </script>
</body>
</html>
