<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block legal_title %}{% endblock %} — Vantav</title>
  <style>
    :root {
      --bg: #0c0c11;
      --card: #14141c;
      --ink: #f4f2f9;
      --muted: #c6c3d2;
      --line: #23232d;
      --accent: #8b5cf6;
      --accent-2: #a78bfa;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 1.7;
    }
    .container { width: 100%; max-width: 760px; margin: 0 auto; }
    .back { color: var(--muted); text-decoration: none; font-size: .85rem; }
    .back:hover { color: var(--ink); }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    h2 { font-size: 1.2rem; margin-top: 2rem; color: var(--accent-2); }
    p, li { color: var(--muted); }
    a { color: var(--accent); }
    footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--line); font-size: .75rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="/">← Back to Vantav</a>
    {% block legal_content %}{% endblock %}
    <footer>
      &copy; 2026 Vantav LLC. All rights reserved.
      <br>
      <a href="/terms">Terms</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/refund">Refund</a>
    </footer>
  </div>
</body>
</html>
