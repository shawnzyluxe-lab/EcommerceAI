<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply for the Vantav Closed Beta</title>
  <style>
    :root {
      --bg: #050505;
      --card: #0f0f0f;
      --ink: #f5f5f5;
      --muted: #888;
      --line: #222;
      --accent: #d4af37;
      --accent-2: #a78bfa;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container { width: 100%; max-width: 680px; }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: .6rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
      margin: 0 0 .5rem;
      background: linear-gradient(90deg, #fff, #a8a8a8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      text-align: center;
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.6rem;
    }
    .field { margin-bottom: 1.1rem; }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; text-transform: uppercase; letter-spacing: .08em; }
    input, textarea, select, button {
      width: 100%;
      padding: .85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #050505;
      color: var(--ink);
      font-size: .95rem;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 90px; resize: vertical; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .4rem; }
    .checkbox { display: flex; align-items: center; gap: .4rem; font-size: .9rem; color: #bbb; }
    .checkbox input { width: auto; }
    .checkbox label { margin: 0; text-transform: none; letter-spacing: 0; font-size: .9rem; color: var(--ink); }
    button {
      background: var(--accent);
      color: #050505;
      border: none;
      font-weight: 800;
      cursor: pointer;
      transition: opacity .15s;
      margin-top: .5rem;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .message { margin-top: 1rem; text-align: center; font-size: .9rem; min-height: 1.2rem; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
    .muted { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 1rem; }
    .muted a { color: var(--accent-2); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">Vantav Closed Beta</div>
    <h1>Apply for the Vantav Closed Beta</h1>
    <p class="sub">We're hand-picking the first 15 multi-channel operators. Tell us about your store.</p>

    <form class="form" id="apply-form">
      <div class="field">
        <label for="email">Business email</label>
        <input type="email" id="email" name="email" required placeholder="you@store.com">
      </div>
      <div class="field">
        <label for="business_name">Business name</label>
        <input type="text" id="business_name" name="business_name" placeholder="My Brand">
      </div>
      <div class="field">
        <label for="monthly_volume">Current monthly store volume</label>
        <select id="monthly_volume" name="monthly_volume">
          <option value="">Select range</option>
          <option value="Under $1K">Under $1K</option>
          <option value="$1K - $10K">$1K - $10K</option>
          <option value="$10K - $50K">$10K - $50K</option>
          <option value="$50K+">$50K+</option>
        </select>
      </div>
      <div class="field">
        <label>Ad channels you spend on</label>
        <div class="checkbox-group">
          <div class="checkbox"><input type="checkbox" name="ad_channels" value="Meta" id="ch-meta"><label for="ch-meta">Meta</label></div>
          <div class="checkbox"><input type="checkbox" name="ad_channels" value="TikTok" id="ch-tiktok"><label for="ch-tiktok">TikTok</label></div>
          <div class="checkbox"><input type="checkbox" name="ad_channels" value="Google" id="ch-google"><label for="ch-google">Google</label></div>
          <div class="checkbox"><input type="checkbox" name="ad_channels" value="Amazon" id="ch-amazon"><label for="ch-amazon">Amazon</label></div>
          <div class="checkbox"><input type="checkbox" name="ad_channels" value="Other" id="ch-other"><label for="ch-other">Other</label></div>
        </div>
      </div>
      <div class="field">
        <label for="bottleneck">Biggest daily operational bottleneck</label>
        <textarea id="bottleneck" name="bottleneck" placeholder="e.g. I can't tell which ads are actually profitable after refunds and fees."></textarea>
      </div>
      <button type="submit" id="submit-btn">Request Beta Access</button>
      <div class="message" id="message"></div>
      <div class="muted">Or <a href="/subscribe">subscribe directly</a> to skip the waitlist.</div>
    </form>
  </div>

  <script>
    document.getElementById('apply-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('message');
      btn.disabled = true;
      msg.textContent = '';
      msg.className = 'message';
      const channels = Array.from(document.querySelectorAll('input[name="ad_channels"]:checked')).map(c => c.value);
      try {
        const res = await fetch('/api/beta/apply', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('email').value,
            business_name: document.getElementById('business_name').value,
            monthly_volume: document.getElementById('monthly_volume').value,
            ad_channels: channels,
            bottleneck: document.getElementById('bottleneck').value,
          })
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = 'Application received. We\'ll review it and email you within 48 hours.';
          msg.className = 'message success';
          document.getElementById('apply-form').reset();
        } else {
          throw new Error(data.detail || 'Application failed');
        }
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'message error';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
