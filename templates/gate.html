<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Access — {{ shop_name | default('Shawnzy Luxe') }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
</head>
<body class="gate-page">
    <div class="shape shape-pyramid"></div>
    <div class="shape shape-sphere"></div>
    <div class="shape shape-cube"></div>
    <div class="shape shape-cylinder"></div>
    <div class="shape shape-star"></div>
    <div class="shape shape-orb"></div>

    <div class="gate-card">
        <div class="gate-logo">{{ shop_name[0] if shop_name else 'S' }}</div>
        <h1>{{ shop_name | default('Shawnzy Luxe') }}</h1>
        <p class="gate-subtitle">Building mode. Enter the password to continue.</p>
        {% if error %}
            <p class="error">Incorrect password.</p>
        {% endif %}
        <form method="post" action="{{ url_for('site_login') }}">
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Enter</button>
        </form>
    </div>
</body>
</html>
