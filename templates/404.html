<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Vantav</title>
  <meta name="description" content="The page you were looking for is not here. Head back to Vantav to see real profit across Shopify, TikTok Shop and Amazon.">
  <meta name="robots" content="noindex, follow">
  <style>
    :root { --bg: #08080c; --ink: #f5f4f8; --dim: #9c98ab; --line: #1d1c26; --purple: #7c5cff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1.5rem; gap: 1rem; }
    .code { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 800; letter-spacing: -.03em; }
    p { margin: 0; max-width: 30rem; color: var(--dim); line-height: 1.6; }
    .links { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 1rem; }
    a { display: inline-block; padding: .8rem 1.3rem; border-radius: 12px; text-decoration: none;
      font-weight: 600; font-size: .92rem; border: 1px solid var(--line); color: var(--ink); }
    a.primary { background: var(--purple); border-color: transparent; }
  </style>
</head>
<body>
  <main>
    <span class="code">Error 404</span>
    <h1>We can't find that page</h1>
    <p>The link may be out of date. Everything Vantav does — real profit per order, channel margins and the fixes worth making — is a click away.</p>
    <div class="links">
      <a class="primary" href="/">Back to Vantav</a>
      <a href="/pricing">See pricing</a>
      <a href="/demo">Watch the tour</a>
    </div>
  </main>
</body>
</html>
