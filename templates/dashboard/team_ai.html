{% extends 'dashboard/base.html' %}
{% block title %}Team — {{ brand.name }} {{ brand.product }}{% endblock %}
{% block content %}

<section class="page-header">
  <h1>Team</h1>
  <p>Manage and monitor your specialist team.</p>
</section>

<div style="text-align: right; margin-bottom: 16px;">
  <button class="btn btn-primary">▶ Run All</button>
</div>

<div class="grid grid-3">
  {% for s in specialists %}
  <div class="card">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; color: var(--gold); font-size: 1.1rem; flex: none;">◆</div>
      <div style="flex: 1;">
        <div style="font-weight: 700; font-size: .95rem;">{{ s.name }}</div>
        <span class="tag {{ {'working':'tag-blue','attention':'tag-amber','idle':'tag-ghost'}[s.state] }}">{{ s.state }}</span>
      </div>
    </div>
    <div style="font-size: .84rem; color: var(--ink-3); margin-bottom: 16px;">{{ s.status }}</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn" style="flex: 1; font-size: .75rem;">View</button>
      <button class="btn btn-primary" style="flex: 1; font-size: .75rem;">Configure</button>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
