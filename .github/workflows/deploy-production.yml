name: Vantav Production CI/CD

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  RENDER_SERVICE_ID: srv-d9s52rqfngtc73ej57pg

jobs:
  test-and-deploy:
    name: Lint, Test, and Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application syntax
        run: |
          python3 -m py_compile app.py dashboard_context.py

      - name: Run test suite
        run: |
          python3 -m pytest tests/test_core.py -q

      - name: Deploy to Render
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
